name: Visibility check

# Weekly canary: captures that failed their on-save check, plus a random sample of rebuilt pages.
on:
  workflow_dispatch:
    inputs:
      only:
        description: "One page to explain, e.g. en-US@/tableware/ (empty = all pages)"
        default: ""

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: capture/requirements.txt
      - run: |
          pip install -r capture/requirements.txt
          python -m playwright install --with-deps chromium
      - env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          HINDSIGHT_ONLY: ${{ inputs.only }}
        run: python tools/visibility_check.py
