name: Deploy archive function

# Deploys the read-only `archive` edge function (supabase/functions/archive) when it changes on main,
# or by hand. Deploying needs a SUPABASE_ACCESS_TOKEN repository secret (a Supabase personal access token);
# without it the job only checks whether the function is live (the Supabase GitHub integration may deploy it).
# No keys are stored in the function: it reads Supabase's own environment.
on:
  push:
    branches: [main]
    paths:
      - supabase/functions/archive/**
      - .github/workflows/functions-deploy.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: functions-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: 2.53.6

      - name: Project
        run: |
          ref=$(echo "$SUPABASE_URL" | sed -E 's#https?://([a-z0-9]+)\.supabase\.co.*#\1#')
          echo "SUPABASE_PROJECT_REF=$ref" >> "$GITHUB_ENV"
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then echo "::warning::No SUPABASE_ACCESS_TOKEN secret: skipping deploy, only checking"; fi

      - name: Deploy
        if: env.SUPABASE_ACCESS_TOKEN != ''
        run: supabase functions deploy archive --project-ref "$SUPABASE_PROJECT_REF" --no-verify-jwt --use-api

      - name: Smoke test
        run: |
          sleep 5
          base="https://$SUPABASE_PROJECT_REF.supabase.co/functions/v1/archive"
          ok=1
          for p in /api/status /api/markets; do
            echo "== $p"
            code=$(curl -sS -o body.txt -w "%{http_code}" -H "Origin: https://example.claudeusercontent.com" "$base$p")
            echo "status $code"; head -c 600 body.txt; echo
            [ "$code" = 200 ] || ok=0
          done
          [ $ok = 1 ]
