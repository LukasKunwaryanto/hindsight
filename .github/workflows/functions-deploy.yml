name: Deploy archive function

# Deploys the read-only `archive` edge function (supabase/functions/archive) when it changes on main,
# or by hand. Uses the SUPABASE_ACCESS_TOKEN and SUPABASE_PROJECT_REF repository secrets; no keys are
# stored in the function, it reads Supabase's own environment.
on:
  push:
    branches: [main]
    paths:
      - supabase/functions/archive/**
      - .github/workflows/functions-deploy.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: functions-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: 2.53.6

      - name: Check secrets are set
        run: |
          for v in SUPABASE_ACCESS_TOKEN SUPABASE_PROJECT_REF; do
            if [ -z "${!v}" ]; then echo "::error::Missing repository secret $v"; exit 1; fi
          done

      - name: Deploy
        run: supabase functions deploy archive --project-ref "$SUPABASE_PROJECT_REF" --no-verify-jwt --use-api

      - name: Smoke test
        run: |
          sleep 5
          curl -fsS "https://$SUPABASE_PROJECT_REF.supabase.co/functions/v1/archive/api/status"
          echo
          curl -fsS "https://$SUPABASE_PROJECT_REF.supabase.co/functions/v1/archive/api/markets" | head -c 400
          echo
