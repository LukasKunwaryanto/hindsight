name: Capture test

# Captures real pages into a throwaway store (not Supabase), twice, and screenshots the rebuilt pages.
on:
  workflow_dispatch:
    inputs:
      targets:
        default: "sv-SE,sv-SE@/belysning/,sv-SE@/nyheter/,sv-SE@/inspiration-tips/,kitchentime:sv-SE,kitchentime:sv-SE@/matlagning/"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: capture/requirements.txt
      - run: |
          pip install -r capture/requirements.txt
          python -m playwright install --with-deps chromium
      - name: Capture twice
        run: |
          python capture/run.py --markets "${{ inputs.targets }}" --devices desktop --store memory:store.pkl --rebuild-dir out --reason pass
          python capture/run.py --markets "${{ inputs.targets }}" --devices desktop --store memory:store.pkl --reason pass
      - name: Screenshots
        run: |
          python - <<'PY'
          import asyncio, glob
          from playwright.async_api import async_playwright
          async def main():
              async with async_playwright() as p:
                  b = await p.chromium.launch()
                  for f in sorted(glob.glob("out/*.html")):
                      pg = await b.new_page(viewport={"width": 1440, "height": 900})
                      await pg.goto("file://" + __import__("os").path.abspath(f)); await pg.wait_for_timeout(2500)
                      await pg.screenshot(path=f.replace(".html", ".png"), full_page=True); await pg.close()
                  await b.close()
          asyncio.run(main())
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: capture-test
          path: out
          retention-days: 3
