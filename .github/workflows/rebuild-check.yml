name: Rebuild check

# Rebuilds the newest snapshots from the database and checks every block, card and price resolves.
on:
  workflow_dispatch:
    inputs:
      markets:
        description: Comma separated locales
        default: sv-SE,de-DE,ja-JP

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install lxml
      - env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: python tools/check_rebuild.py "${{ inputs.markets }}"
