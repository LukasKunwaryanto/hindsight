name: Contentful setup

# Run once to switch on automatic captures. Safe to re-run if the poller ever loses its place.
on:
  workflow_dispatch:
    inputs:
      site:
        description: Which site's Contentful space
        type: choice
        options: [nordicnest, kitchentime, svenssons]
        default: nordicnest

permissions:
  contents: read

jobs:
  init:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Store sync position and startpage tree
        env:
          HINDSIGHT_SITE: ${{ inputs.site }}
          CONTENTFUL_DELIVERY_TOKEN: ${{ secrets.CONTENTFUL_DELIVERY_TOKEN }}
          CONTENTFUL_DELIVERY_TOKEN_KITCHENTIME: ${{ secrets.CONTENTFUL_DELIVERY_TOKEN_KITCHENTIME }}
          CONTENTFUL_DELIVERY_TOKEN_SVENSSONS: ${{ secrets.CONTENTFUL_DELIVERY_TOKEN_SVENSSONS }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: python sync/init_sync.py
