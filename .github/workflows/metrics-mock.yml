name: Sample metrics

# Fills the metric tables with sample numbers for the POC demo, attached to the real
# captured promotions. Stand-in for the daily BigQuery sync until we have access:
# rows are marked source = 'mock' and the real sync replaces them.
# Started daily at 06:40 Stockholm by the database scheduler (see sync-poll JOBS), not by GitHub's schedule.
on:
  workflow_dispatch:
    inputs:
      days_back:
        description: "Days of made-up history before each market's first capture (0 = only days with a capture)"
        default: "0"
        required: true

permissions:
  contents: read

jobs:
  mock:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: python tools/mock_metrics.py --days-back "${{ inputs.days_back || '0' }}"
