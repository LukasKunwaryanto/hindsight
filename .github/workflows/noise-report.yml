name: Noise report

on:
  workflow_dispatch:
    inputs:
      limit:
        description: How many of the latest style/text changes to analyse
        default: "400"

permissions:
  contents: read

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          NOISE_LIMIT: ${{ inputs.limit }}
        run: python tools/noise_report.py
