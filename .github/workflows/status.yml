name: Status

# Shows when Contentful was last checked, recent startpage changes and capture requests.
on:
  workflow_dispatch:
    inputs:
      test_market:
        description: "Optional: queue a test capture for this market (e.g. sv-SE)"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  status:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: python tools/status.py "${{ inputs.test_market }}"
