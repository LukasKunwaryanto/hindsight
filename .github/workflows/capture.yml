name: Capture

on:
  # Temporary until Svenssons has a Contentful delivery key (CONTENTFUL_DELIVERY_TOKEN_SVENSSONS):
  # Svenssons twice a day (07:10 and 13:10 Stockholm). Pages that didn't change are not stored.
  # Nordic Nest and KitchenTime are captured when Contentful changes (sync-poll).
  schedule:
    - cron: "10 6,12 * * *"
  workflow_dispatch:
    inputs:
      markets:
        description: "Markets: 'all', comma separated ids (sv-SE,kitchentime:de-DE) or a whole site (site:svenssons,site:kitchentime)"
        default: sv-SE
        required: true
      devices:
        description: Devices (comma separated)
        default: desktop,mobile
        required: true
      reason:
        description: Why this capture runs (manual, contentful, initial)
        default: manual
        required: false

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: capture/requirements.txt

      - name: Install
        run: |
          pip install -r capture/requirements.txt
          python -m playwright install --with-deps chromium

      - name: Capture and store
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          HINDSIGHT_BYPASS_HEADER: ${{ secrets.HINDSIGHT_BYPASS_HEADER }}
          # Page format v2 (chunked CSS lists, stable card keys). Readers: capture/rebuild.py and
          # hindsight-app lib/hindsight/rebuild.ts (6c2aaab or later).
          HINDSIGHT_MANIFEST_V2: "1"
        run: >
          python capture/run.py
          --markets "${{ inputs.markets || 'site:svenssons' }}"
          --devices "${{ inputs.devices || 'desktop,mobile' }}"
          --reason "${{ inputs.reason || (github.event_name == 'schedule' && 'scheduled') || 'manual' }}"
