name: Capture

# Started by the database scheduler (see sync-poll): on Contentful changes for Nordic Nest and KitchenTime,
# and twice a day for Svenssons (07:10, 13:10 Stockholm) until Svenssons has a Contentful delivery key.
on:
  workflow_dispatch:
    inputs:
      markets:
        description: "Startpages: 'all', ids (sv-SE,kitchentime:de-DE) or a site (site:svenssons). Inner pages: 'pages', 'pages:menu', 'pages:site:kitchentime' or one page (sv-SE@/nyheter/)"
        default: sv-SE
        required: true
      devices:
        description: Devices (comma separated)
        default: desktop,mobile
        required: true
      reason:
        description: Why this capture runs (manual, contentful, initial)
        default: manual
        required: false

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: capture/requirements.txt

      - name: Install
        run: |
          pip install -r capture/requirements.txt
          # the runner's package mirror sometimes fails for a few minutes: try again before giving up
          for i in 1 2 3 4; do
            python -m playwright install --with-deps chromium && break
            [ "$i" = 4 ] && exit 1
            echo "Browser install failed, retrying in $((i * 30)) s"; sleep $((i * 30))
          done

      - name: Capture and store
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          HINDSIGHT_BYPASS_HEADER: ${{ secrets.HINDSIGHT_BYPASS_HEADER }}
          # Page format v2 (chunked CSS lists, stable card keys). Readers: capture/rebuild.py and
          # hindsight-app lib/hindsight/rebuild.ts (6c2aaab or later).
          HINDSIGHT_MANIFEST_V2: "1"
        run: >
          python capture/run.py
          --markets "${{ inputs.markets || 'site:svenssons' }}"
          --devices "${{ inputs.devices || 'desktop,mobile' }}"
          --reason "${{ inputs.reason || (github.event_name == 'schedule' && 'scheduled') || 'manual' }}"
